<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL PPR Rankings</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #16191d; --muted: #646b75; --border: #dfe3e8;
  --row-alt: #fafbfc; --hover: #eef3fb; --accent: #2457c5; --accent-soft: #e3ebfa;
  --bar: #cfe0fb; --group: #eef1f5; --good: #1d7a46; --bad: #b3361f;
  --QB: #8a4fd1; --RB: #1d8a5a; --WR: #2563c9; --TE: #c46a12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d23; --text: #e6e9ed; --muted: #98a1ad; --border: #2c323b;
    --row-alt: #1c2027; --hover: #232a35; --accent: #7aa5ff; --accent-soft: #23314d;
    --bar: #27406b; --group: #20252d; --good: #5ccf8e; --bad: #ff8a73;
    --QB: #b791f2; --RB: #5fd19c; --WR: #7aa5ff; --TE: #f0a35a;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --text: #e6e9ed; --muted: #98a1ad; --border: #2c323b;
  --row-alt: #1c2027; --hover: #232a35; --accent: #7aa5ff; --accent-soft: #23314d;
  --bar: #27406b; --group: #20252d; --good: #5ccf8e; --bad: #ff8a73;
  --QB: #b791f2; --RB: #5fd19c; --WR: #7aa5ff; --TE: #f0a35a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header { padding: 14px 16px 10px; }
h1 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; }
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { color: var(--muted); font-size: 12px; }
select, input[type=search] {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px;
}
input[type=search] { width: 180px; }
.chips { display: flex; gap: 4px; }
.chip {
  font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); border-radius: 999px; padding: 3px 10px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.count { margin-left: auto; color: var(--muted); font-size: 12px; }
.wrap { flex: 1; overflow: auto; min-height: 0; }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
thead { position: sticky; top: 0; z-index: 3; }
th {
  background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px;
  text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--accent); }
th .arrow { display: inline-block; width: 10px; font-size: 10px; }
th.grp { text-align: center; color: var(--text); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); }
th.gl, td.gl { border-left: 1px solid var(--border); }
td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
th.txt, td.txt { text-align: left; }
tbody tr.p:nth-child(even) td { background: var(--row-alt); }
tbody tr.p:hover td { background: var(--hover); }
td { background: var(--bg); }
.stick { position: sticky; z-index: 2; }
thead .stick { z-index: 4; }
.c-rank { left: 0; width: 46px; min-width: 46px; }
.c-player { left: 46px; min-width: 170px; border-right: 1px solid var(--border); }
td.c-player { font-weight: 600; }
.pos { font-weight: 700; font-size: 11px; }
.pos.QB { color: var(--QB); } .pos.RB { color: var(--RB); } .pos.WR { color: var(--WR); } .pos.TE { color: var(--TE); }
.proj { position: relative; font-weight: 700; }
.proj .bar { position: absolute; left: 0; top: 3px; bottom: 3px; background: var(--bar); border-radius: 0 3px 3px 0; z-index: 0; }
.proj span { position: relative; z-index: 1; }
.fav { color: var(--good); }
.dog { color: var(--bad); }
.na { color: var(--muted); opacity: .5; }
.small { color: var(--muted); font-size: 11px; }
tr.gh td {
  background: var(--group); font-weight: 700; text-align: left; cursor: pointer;
  position: sticky; left: 0; z-index: 1;
}
tr.gh td .gmeta { color: var(--muted); font-weight: 400; margin-left: 10px; }
tr.gh td .caret { display: inline-block; width: 14px; transition: transform .15s; }
tr.gh.collapsed td .caret { transform: rotate(-90deg); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  input[type=search] { width: 130px; }
  .count { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>NFL PPR Rankings</h1>
  <div class="sub" id="sub"></div>
</header>

<div class="controls">
  <label class="ctl"><span>Search</span><input type="search" id="q" placeholder="Player name"></label>
  <div class="ctl"><span>Position</span><div class="chips" id="posChips"></div></div>
  <label class="ctl"><span>Team</span><select id="team"><option value="">All teams</option></select></label>
  <label class="ctl"><span>Game</span><select id="game"><option value="">All games</option></select></label>
  <label class="ctl"><span>Group by</span>
    <select id="groupBy">
      <option value="">None</option><option value="Pos">Position</option>
      <option value="Team">Team</option><option value="Game">Game</option>
    </select>
  </label>
  <div class="ctl"><span>Show</span><div class="chips">
    <button class="chip" id="showProj" aria-pressed="true">Projections</button>
    <button class="chip" id="showOdds" aria-pressed="true">Lines &amp; odds</button>
  </div></div>
  <div class="count" id="count"></div>
</div>

<div class="wrap" id="wrap"><table id="tbl"><thead id="thead"></thead></table></div>

<script>
const DATA = /*__DATA__*/null;
const ROWS = DATA.rows;

const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const impliedProb = a => { const v = num(a); if (v === null) return null; return v > 0 ? 100 / (v + 100) : -v / (-v + 100); };
const fmt1 = v => v === null ? "" : (+v).toFixed(1);
const fmt2 = v => v === null ? "" : (+v).toFixed(2);

// ---- column definitions ---------------------------------------------------
const COLS = [
  { key: "Rank", label: "#", type: "num", cls: "stick c-rank", title: "Overall rank by projected PPR" },
  { key: "Player", label: "Player", type: "text", cls: "stick c-player txt" },
  { key: "Pos", label: "Pos", type: "text", cls: "txt", render: r => `<span class="pos ${r.Pos}">${r.Pos}</span>` },
  { key: "Pos Rank", label: "Pos Rk", type: "posrank", title: "Rank within position" },
  { key: "Team", label: "Team", type: "text", cls: "txt" },
  { key: "Opp", label: "Opp", type: "text", cls: "txt" },
  { key: "Kickoff (UTC)", label: "Kickoff", type: "time", cls: "txt", render: r => kickoff(r["Kickoff (UTC)"]) },
  { key: "Proj PPR", label: "Proj PPR", type: "num", cls: "gl", title: "Projected full-PPR points from props", render: r => projCell(r) },
  { key: "UD Pts → PPR", label: "UD PPR", type: "num", title: "Underdog Fantasy Points line (half-PPR) converted to full PPR", render: r => fmt2(num(r["UD Pts → PPR"])) },
  { key: "Anytime TD %", label: "TD %", type: "num", title: "No-vig probability of an anytime rush/rec TD", render: r => num(r["Anytime TD %"]) === null ? "" : `${(+r["Anytime TD %"]).toFixed(0)}%` },

  { key: "Exp Pass Yds", label: "Pass Yds", type: "num", group: "proj", gl: true, render: r => z(r["Exp Pass Yds"], fmt1) },
  { key: "Exp Pass TD", label: "Pass TD", type: "num", group: "proj", render: r => z(r["Exp Pass TD"], fmt2) },
  { key: "Exp INT", label: "INT", type: "num", group: "proj", render: r => z(r["Exp INT"], fmt2) },
  { key: "Exp Rush Yds", label: "Rush Yds", type: "num", group: "proj", render: r => z(r["Exp Rush Yds"], fmt1) },
  { key: "Exp Rec", label: "Rec", type: "num", group: "proj", render: r => z(r["Exp Rec"], fmt2) },
  { key: "Exp Rec Yds", label: "Rec Yds", type: "num", group: "proj", render: r => z(r["Exp Rec Yds"], fmt1) },
  { key: "Exp TDs", label: "Rush/Rec TD", type: "num", group: "proj", render: r => z(r["Exp TDs"], fmt2) },
];
const ODDS_STATS = ["Pass Yds", "Pass TDs", "INTs", "Rush Yds", "Receptions", "Rec Yds", "Anytime TD", "UD Fantasy Pts"];
for (const s of ODDS_STATS) {
  COLS.push({ key: `${s} Line`, label: "Line", type: "num", group: "odds", stat: s, gl: true });
  COLS.push({ key: `${s} Over`, label: "Over", type: "odds", group: "odds", stat: s, title: "Sorted by implied probability", render: r => oddsCell(r[`${s} Over`]) });
  COLS.push({ key: `${s} Under`, label: "Under", type: "odds", group: "odds", stat: s, title: "Sorted by implied probability", render: r => oddsCell(r[`${s} Under`]) });
}

function z(v, f) { const n = num(v); return n === null || n === 0 ? `<span class="na">–</span>` : f(n); }
function oddsCell(a) {
  const v = num(a); if (v === null) return "";
  return `<span class="${v < 0 ? "fav" : "dog"}">${v > 0 ? "+" + v : v}</span>`;
}
const MAX_PROJ = Math.max(...ROWS.map(r => num(r["Proj PPR"]) || 0), 1);
function projCell(r) {
  const v = num(r["Proj PPR"]);
  const w = Math.max(0, Math.min(100, v / MAX_PROJ * 100));
  return `<div class="bar" style="width:${w}%"></div><span>${fmt2(v)}</span>`;
}
function kickoff(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
}

// ---- state ------------------------------------------------------------------
const state = {
  q: "", pos: new Set(), team: "", game: "", groupBy: "",
  sortKey: "Proj PPR", sortDir: -1, show: { proj: true, odds: true }, collapsed: new Set(),
};
try { Object.assign(state, JSON.parse(localStorage.getItem("pprUi") || "{}"), { pos: new Set(), collapsed: new Set(), q: "", team: "", game: "" }); } catch (e) {}
function save() {
  try { localStorage.setItem("pprUi", JSON.stringify({ groupBy: state.groupBy, sortKey: state.sortKey, sortDir: state.sortDir, show: state.show })); } catch (e) {}
}

// ---- controls -------------------------------------------------------------------
const $ = id => document.getElementById(id);
$("sub").textContent = `${ROWS.length} players · Underdog lines pulled ${new Date(DATA.generated).toLocaleString()} · click any column to sort`;

const POS = ["QB", "RB", "WR", "TE"];
$("posChips").innerHTML = ["All", ...POS].map(p => `<button class="chip" data-pos="${p}">${p}</button>`).join("");
$("posChips").addEventListener("click", e => {
  const p = e.target.dataset.pos; if (!p) return;
  if (p === "All") state.pos.clear(); else state.pos.has(p) ? state.pos.delete(p) : state.pos.add(p);
  render();
});
const uniq = k => [...new Set(ROWS.map(r => r[k]).filter(Boolean))].sort();
$("team").innerHTML += uniq("Team").map(t => `<option>${t}</option>`).join("");
const games = [...new Map(ROWS.map(r => [r.Game, r["Kickoff (UTC)"]])).entries()].filter(g => g[0]).sort((a, b) => (a[1] || "").localeCompare(b[1] || "") || a[0].localeCompare(b[0]));
$("game").innerHTML += games.map(([g, t]) => `<option value="${g}">${g} · ${kickoff(t)}</option>`).join("");

$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("team").addEventListener("change", e => { state.team = e.target.value; render(); });
$("game").addEventListener("change", e => { state.game = e.target.value; render(); });
$("groupBy").value = state.groupBy;
$("groupBy").addEventListener("change", e => { state.groupBy = e.target.value; state.collapsed.clear(); save(); render(); });
for (const [id, k] of [["showProj", "proj"], ["showOdds", "odds"]]) {
  $(id).addEventListener("click", () => { state.show[k] = !state.show[k]; save(); render(); });
}

// ---- sorting ----------------------------------------------------------------------
function sortVal(col, r) {
  const v = r[col.key];
  switch (col.type) {
    case "text": return v ? String(v).toLowerCase() : null;
    case "time": return v || null;
    case "odds": return impliedProb(v);
    case "posrank": return num(String(v || "").replace(/^\D+/, ""));
    default: return num(v);
  }
}
function cmp(col, dir) {
  return (a, b) => {
    const x = sortVal(col, a), y = sortVal(col, b);
    if (x === null && y === null) return a.Rank - b.Rank;
    if (x === null) return 1;          // blanks always last
    if (y === null) return -1;
    if (x < y) return -dir;
    if (x > y) return dir;
    return a.Rank - b.Rank;
  };
}

// ---- render ----------------------------------------------------------------------------
function visibleCols() { return COLS.filter(c => !c.group || state.show[c.group]); }

function renderHead(cols) {
  const hasOdds = cols.some(c => c.group === "odds");
  const th = c => {
    const sorted = c.key === state.sortKey;
    const arrow = sorted ? (state.sortDir < 0 ? "▼" : "▲") : "";
    const cls = ["sortable", c.cls || "", c.gl ? "gl" : "", sorted ? "sorted" : "", c.type === "text" || c.type === "time" ? "txt" : ""].join(" ");
    return `<th class="${cls}" data-key="${c.key}" title="${c.title || ""}"${hasOdds && !c.stat ? ' rowspan="2"' : ""}>${c.label}<span class="arrow">${arrow}</span></th>`;
  };
  if (!hasOdds) return `<tr>${cols.map(th).join("")}</tr>`;
  // two header rows: odds columns grouped under their stat name
  let top = "", bottom = "";
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    if (!c.stat) { top += th(c); continue; }
    if (c.label === "Line") top += `<th class="grp" colspan="3">${c.stat}</th>`;
    bottom += th(c);
  }
  return `<tr>${top}</tr><tr>${bottom}</tr>`;
}

function renderRow(r, cols) {
  return `<tr class="p">${cols.map(c => {
    const cls = [c.cls || "", c.gl ? "gl" : "", c.key === "Proj PPR" ? "proj" : "", c.type === "text" || c.type === "time" ? "txt" : ""].join(" ");
    const v = c.render ? c.render(r) : (r[c.key] ?? "");
    return `<td class="${cls}">${v}</td>`;
  }).join("")}</tr>`;
}

function render() {
  for (const b of $("posChips").children) {
    const p = b.dataset.pos;
    b.setAttribute("aria-pressed", p === "All" ? state.pos.size === 0 : state.pos.has(p));
  }
  $("showProj").setAttribute("aria-pressed", state.show.proj);
  $("showOdds").setAttribute("aria-pressed", state.show.odds);

  const cols = visibleCols();
  const sortCol = COLS.find(c => c.key === state.sortKey) || COLS[7];
  let rows = ROWS.filter(r =>
    (!state.pos.size || state.pos.has(r.Pos)) &&
    (!state.team || r.Team === state.team) &&
    (!state.game || r.Game === state.game) &&
    (!state.q || r.Player.toLowerCase().includes(state.q)));
  rows.sort(cmp(sortCol, state.sortDir));
  $("count").textContent = `${rows.length} of ${ROWS.length} players`;

  const tbl = $("tbl");
  tbl.querySelectorAll("tbody").forEach(t => t.remove());
  $("thead").innerHTML = renderHead(cols);

  if (!rows.length) {
    tbl.insertAdjacentHTML("beforeend", `<tbody><tr><td class="empty" colspan="${cols.length}">No players match these filters.</td></tr></tbody>`);
    return;
  }

  if (!state.groupBy) {
    tbl.insertAdjacentHTML("beforeend", `<tbody>${rows.map(r => renderRow(r, cols)).join("")}</tbody>`);
    return;
  }

  const groups = new Map();
  for (const r of rows) {
    const k = r[state.groupBy] || "—";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  let keys = [...groups.keys()];
  if (state.groupBy === "Pos") keys.sort((a, b) => POS.indexOf(a) - POS.indexOf(b));
  else if (state.groupBy === "Game") keys.sort((a, b) => (groups.get(a)[0]["Kickoff (UTC)"] || "").localeCompare(groups.get(b)[0]["Kickoff (UTC)"] || "") || a.localeCompare(b));
  else keys.sort();

  let html = "";
  for (const k of keys) {
    const g = groups.get(k);
    const projs = g.map(r => num(r["Proj PPR"]) || 0);
    const total = projs.reduce((a, b) => a + b, 0);
    const collapsed = state.collapsed.has(k);
    const meta = `${g.length} player${g.length === 1 ? "" : "s"} · total ${total.toFixed(1)} · avg ${(total / g.length).toFixed(1)} proj PPR`;
    html += `<tbody><tr class="gh${collapsed ? " collapsed" : ""}" data-group="${k}"><td colspan="${cols.length}"><span class="caret">▾</span>${k}<span class="gmeta">${meta}</span></td></tr>`;
    if (!collapsed) html += g.map(r => renderRow(r, cols)).join("");
    html += `</tbody>`;
  }
  tbl.insertAdjacentHTML("beforeend", html);
}

$("thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-key]"); if (!th) return;
  const col = COLS.find(c => c.key === th.dataset.key);
  if (state.sortKey === col.key) state.sortDir *= -1;
  else { state.sortKey = col.key; state.sortDir = (col.type === "text" || col.type === "time" || col.type === "posrank" || col.key === "Rank") ? 1 : -1; }
  save(); render();
});
$("tbl").addEventListener("click", e => {
  const gh = e.target.closest("tr.gh"); if (!gh) return;
  const k = gh.dataset.group;
  state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
  render();
});

render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL PPR Rankings</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #16191d; --muted: #646b75; --border: #dfe3e8;
  --row-alt: #fafbfc; --hover: #eef3fb; --accent: #2457c5; --accent-soft: #e3ebfa;
  --bar: #cfe0fb; --group: #eef1f5; --good: #1d7a46; --bad: #b3361f;
  --ud: #6b4fd1; --sl: #0f8a8a; --fp: #c2410c; --avg: #16191d;
  --QB: #8a4fd1; --RB: #1d8a5a; --WR: #2563c9; --TE: #c46a12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --panel: #191d23; --text: #e6e9ed; --muted: #98a1ad; --border: #2c323b;
    --row-alt: #1c2027; --hover: #232a35; --accent: #7aa5ff; --accent-soft: #23314d;
    --bar: #27406b; --group: #20252d; --good: #5ccf8e; --bad: #ff8a73;
    --ud: #a993f5; --sl: #4fd1d1; --fp: #fb923c; --avg: #e6e9ed;
    --QB: #b791f2; --RB: #5fd19c; --WR: #7aa5ff; --TE: #f0a35a;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --text: #e6e9ed; --muted: #98a1ad; --border: #2c323b;
  --row-alt: #1c2027; --hover: #232a35; --accent: #7aa5ff; --accent-soft: #23314d;
  --bar: #27406b; --group: #20252d; --good: #5ccf8e; --bad: #ff8a73;
  --ud: #a993f5; --sl: #4fd1d1; --fp: #fb923c; --avg: #e6e9ed;
  --QB: #b791f2; --RB: #5fd19c; --WR: #7aa5ff; --TE: #f0a35a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header { padding: 14px 16px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
h1 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab {
  font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--border); border-bottom: none;
  background: var(--bg); color: var(--muted); padding: 7px 14px; border-radius: 8px 8px 0 0;
}
.tab[aria-selected="true"] { background: var(--panel); color: var(--text); }
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px;
  padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border);
}
.controls + .controls { margin-top: 0; padding-top: 0; border-top: none; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ctl[hidden], .controls[hidden] { display: none; }
select, input[type=search] {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; max-width: 220px;
}
input[type=search] { width: 170px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); border-radius: 999px; padding: 3px 10px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip.site-UD[aria-pressed="true"] { background: var(--ud); border-color: var(--ud); }
.chip.site-SL[aria-pressed="true"] { background: var(--sl); border-color: var(--sl); }
.chip.site-FP[aria-pressed="true"] { background: var(--fp); border-color: var(--fp); }
.chip.link { border: none; background: none; color: var(--accent); padding: 3px 4px; }
.count { margin-left: auto; color: var(--muted); font-size: 12px; }
.wrap { flex: 1; overflow: auto; min-height: 0; border-top: 1px solid var(--border); }
table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
thead { position: sticky; top: 0; z-index: 3; }
th {
  background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px;
  text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--accent) !important; }
th .arrow { display: inline-block; width: 10px; font-size: 10px; }
th.band { text-align: center; color: var(--text); border-left: 1px solid var(--border); font-size: 13px; }
th.subband { text-align: center; border-left: 1px solid var(--border); }
th.site-UD { color: var(--ud); }
th.site-SL { color: var(--sl); }
th.site-FP { color: var(--fp); }
th.site-Avg { color: var(--avg); }
th.gl, td.gl { border-left: 1px solid var(--border); }
td { padding: 5px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; background: var(--bg); }
th.txt, td.txt { text-align: left; }
tbody tr.p:nth-child(even) td { background: var(--row-alt); }
tbody tr.p:hover td { background: var(--hover); }
.stick { position: sticky; z-index: 2; }
thead .stick { z-index: 4; }
.c-rank { left: 0; width: 46px; min-width: 46px; }
.c-player { left: 46px; min-width: 170px; border-right: 1px solid var(--border); }
.view-compare .c-player { left: 0; }
td.c-player { font-weight: 600; }
.pos { font-weight: 700; font-size: 11px; }
.pos.QB { color: var(--QB); } .pos.RB { color: var(--RB); } .pos.WR { color: var(--WR); } .pos.TE { color: var(--TE); }
.fav { color: var(--good); }
.dog { color: var(--bad); }
.na { color: var(--muted); opacity: .5; }
.recent { color: var(--muted); font-size: 11px; text-align: left; }
.sites { font-size: 11px; font-weight: 600; }
.sites.Underdog { color: var(--ud); } .sites.Sleeper { color: var(--sl); }
.note { color: var(--muted); font-size: 12px; }
tr.gh td {
  background: var(--group); font-weight: 700; text-align: left; cursor: pointer;
  position: sticky; left: 0; z-index: 1;
}
tr.gh td .gmeta { color: var(--muted); font-weight: 400; margin-left: 10px; }
tr.gh td .caret { display: inline-block; width: 14px; transition: transform .15s; }
tr.gh.collapsed td .caret { transform: rotate(-90deg); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.more { padding: 14px; text-align: center; }
.more button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 14px; }
@media (max-width: 640px) {
  input[type=search] { width: 130px; }
  .count { margin-left: 0; width: 100%; }
  .tabs { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>NFL PPR Rankings</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="rankings">PPR Rankings</button>
    <button class="tab" role="tab" data-view="compare">Odds Comparison</button>
  </div>
</header>

<div class="controls">
  <label class="ctl"><span>Search</span><input type="search" id="q" placeholder="Player name"></label>
  <div class="ctl"><span>Position</span><div class="chips" id="posChips"></div></div>
  <label class="ctl"><span>Team</span><select id="team"></select></label>
  <label class="ctl"><span>Game</span><select id="game"></select></label>
  <label class="ctl" id="statCtl"><span>Stat</span><select id="stat"></select></label>
  <label class="ctl" id="sitesCtl"><span>Offered on</span>
    <select id="sites">
      <option value="Both">Both sites</option><option value="">Either site</option>
      <option value="Underdog">Underdog only</option><option value="Sleeper">Sleeper only</option>
    </select>
  </label>
  <label class="ctl"><span>Group by</span><select id="groupBy"></select></label>
  <div class="ctl"><span>Show</span><div class="chips" id="toggles"></div></div>
  <div class="count" id="count"></div>
</div>
<div class="controls" id="rankBar">
  <div class="ctl" id="siteCtl"><span>Sites</span><div class="chips" id="siteChips"></div></div>
  <label class="ctl"><span>Rank by</span><select id="rankBy"></select></label>
  <div class="ctl"><span>Stats</span><div class="chips" id="statChips"></div></div>
</div>

<div class="wrap" id="wrap"><table id="tbl"><thead id="thead"></thead></table></div>

<script>
const DATA = /*__DATA__*/null;
const META = DATA.meta || {};

// ---- helpers ------------------------------------------------------------------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const impliedProb = a => { const v = num(a); if (v === null) return null; return v > 0 ? 100 / (v + 100) : -v / (-v + 100); };
const fmt = d => v => { const n = num(v); return n === null ? "" : n.toFixed(d); };
const fmt1 = fmt(1), fmt2 = fmt(2);
function oddsCell(a) {
  const v = num(a); if (v === null) return "";
  return `<span class="${v < 0 ? "fav" : "dog"}">${v > 0 ? "+" + v : v}</span>`;
}
function signedCell(v, d = 2) {
  const n = num(v); if (n === null) return "";
  return `<span class="${n > 0 ? "fav" : n < 0 ? "dog" : ""}">${n > 0 ? "+" : ""}${n.toFixed(d)}</span>`;
}
const pctCell = v => { const n = num(v); return n === null ? "" : `${n.toFixed(0)}%`; };
function kickoff(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
}
const POS_ORDER = ["QB", "RB", "WR", "TE", "K", "DL", "DE", "DT", "LB", "OLB", "ILB", "DB", "CB", "S", "SS", "FS"];
const posSort = (a, b) => ((POS_ORDER.indexOf(a) + 1 || 99) - (POS_ORDER.indexOf(b) + 1 || 99)) || a.localeCompare(b);

// ---- rankings columns (built from the chosen sites and stats) ----------------------------
const SITE_NAMES = { UD: "Underdog", SL: "Sleeper", FP: "FantasyPros" };
const SITE_TITLES = {
  UD: "Underdog pick'em line and odds",
  SL: "Sleeper Picks line and odds (payout multipliers converted to American odds)",
  FP: "FantasyPros consensus projection (public pages only show the top 10 per position)",
};
const SITES = META.sites || ["UD"];
const BANDS = META.bands || [];
const RANK_BASES = META.rank_bases || [];   // published fantasy-points numbers the rank can use
const CORE_STATS = ["Fantasy Pts", "Pass Yds", "Pass TDs", "INTs", "Rush Yds", "Receptions", "Rec Yds", "Anytime TD"];

// Which sources have any data for each row
for (const r of DATA.rows) {
  r._has = Object.fromEntries(SITES.map(s => [s, Object.entries(r).some(([k, v]) => k.includes(` ${s} `) && v !== "" && v != null)]));
}
// The rank uses the chosen basis, or the first one whose source is selected
function rankBasis() {
  const ok = b => b && rp.sites.includes(b.site);
  return [RANK_BASES.find(b => b.key === rp.rankBy), ...RANK_BASES].find(ok) || null;
}

function rankCols(p) {
  const sites = SITES.filter(s => p.sites.includes(s));
  const cols = [
    { key: "_rank", label: "#", type: "num", cls: "stick c-rank", title: "Rank by the published fantasy-points number chosen in 'Rank by'" },
    { key: "Player", label: "Player", type: "text", cls: "stick c-player" },
    { key: "Pos", label: "Pos", type: "text", render: r => `<span class="pos ${esc(r.Pos)}">${esc(r.Pos)}</span>` },
    { key: "_posRank", label: "Pos Rk", type: "num", title: "Rank within position", render: r => r._posRank ? esc(r.Pos + r._posRank) : "" },
    { key: "Team", label: "Team", type: "text" },
    { key: "Opp", label: "Opp", type: "text" },
    { key: "Kickoff (UTC)", label: "Kickoff", type: "time", render: r => kickoff(r["Kickoff (UTC)"]) },
  ];
  for (const b of BANDS) {
    if (!p.stats.includes(b.label)) continue;
    sites.forEach((s, si) => {
      const base = { band: b.label, sub: SITE_NAMES[s], site: s };
      const k = f => `${b.label} ${s} ${f}`;
      if (s === "FP") {   // a projection, not a line: one value per stat
        if (b.fp) cols.push({ ...base, key: k("Proj"), label: "Proj", type: "num", gl: si === 0, title: SITE_TITLES.FP, render: r => { const n = num(r[k("Proj")]); return n === null ? "" : String(+n.toFixed(2)); } });
        return;
      }
      cols.push({ ...base, key: k("Line"), label: "Line", type: "num", gl: si === 0, title: SITE_TITLES[s] });
      if (p.show.odds) {
        cols.push({ ...base, key: k("Over"), label: "Over", type: "odds", title: "Sorted by implied probability", render: r => oddsCell(r[k("Over")]) });
        cols.push({ ...base, key: k("Under"), label: "Under", type: "odds", title: "Sorted by implied probability", render: r => oddsCell(r[k("Under")]) });
      }
      if (b.pct) cols.push({ ...base, key: k("%"), label: "Prob", type: "num", title: "No-vig probability of an anytime rush/rec TD", render: r => pctCell(r[k("%")]) });
    });
  }
  return cols;
}

// ---- comparison columns --------------------------------------------------------------
const CMP_COLS = [
  { key: "Player", label: "Player", type: "text", cls: "stick c-player" },
  { key: "Pos", label: "Pos", type: "text", render: r => `<span class="pos ${esc(r.Pos)}">${esc(r.Pos)}</span>` },
  { key: "Team", label: "Team", type: "text" },
  { key: "Opp", label: "Opp", type: "text" },
  { key: "Kickoff (UTC)", label: "Kickoff", type: "time", render: r => kickoff(r["Kickoff (UTC)"]) },
  { key: "Stat", label: "Stat", type: "text", gl: true },
  { key: "Sites", label: "On", type: "text", render: r => `<span class="sites ${esc(r.Sites)}">${esc(r.Sites)}</span>` },
  { key: "UD Line", label: "Line", type: "num", band: "Underdog", site: "UD", gl: true },
  { key: "UD Over", label: "Over", type: "odds", band: "Underdog", site: "UD", render: r => oddsCell(r["UD Over"]) },
  { key: "UD Under", label: "Under", type: "odds", band: "Underdog", site: "UD", render: r => oddsCell(r["UD Under"]) },
  { key: "UD Over %", label: "Over %", type: "num", band: "Underdog", site: "UD", title: "No-vig probability of the over", render: r => pctCell(r["UD Over %"]) },
  { key: "SL Line", label: "Line", type: "num", band: "Sleeper", site: "SL", gl: true },
  { key: "SL Over", label: "Over", type: "odds", band: "Sleeper", site: "SL", render: r => oddsCell(r["SL Over"]), title: "Payout multiplier converted to American odds" },
  { key: "SL Under", label: "Under", type: "odds", band: "Sleeper", site: "SL", render: r => oddsCell(r["SL Under"]), title: "Payout multiplier converted to American odds" },
  { key: "SL Over %", label: "Over %", type: "num", band: "Sleeper", site: "SL", title: "No-vig probability of the over", render: r => pctCell(r["SL Over %"]) },
  { key: "Line Δ (SL−UD)", label: "Line", type: "num", band: "Sleeper − Underdog", gl: true, title: "Sleeper line minus Underdog line", render: r => signedCell(r["Line Δ (SL−UD)"], 1) },
  { key: "Over % Δ (SL−UD)", label: "Over %", type: "num", band: "Sleeper − Underdog", title: "Sleeper over % minus Underdog over % (points)", render: r => signedCell(r["Over % Δ (SL−UD)"], 1) },
  { key: "SL Pick Popularity %", label: "Popularity", type: "num", band: "Sleeper pick data", toggle: "picks", gl: true, render: r => pctCell(r["SL Pick Popularity %"]) },
  { key: "SL Picks Over", label: "Picks O", type: "num", band: "Sleeper pick data", toggle: "picks" },
  { key: "SL Picks Under", label: "Picks U", type: "num", band: "Sleeper pick data", toggle: "picks" },
  { key: "SL Recent Over %", label: "Recent over", type: "num", band: "Sleeper pick data", toggle: "picks", title: "Share of recent games (per Sleeper) above the current Sleeper line", render: r => pctCell(r["SL Recent Over %"]) },
  { key: "SL Recent Results", label: "Recent results (oldest → newest)", type: "text", band: "Sleeper pick data", toggle: "picks", tdCls: "recent", sortable: false },
];

const HAS_SLEEPER = SITES.includes("SL");
const VIEWS = {
  rankings: {
    rows: DATA.rows,
    cols: p => rankCols(p),
    groups: [["", "None"], ["Pos", "Position"], ["Team", "Team"], ["Game", "Game"]],
    toggles: [["odds", "Odds"]],
    defaults: { sortKey: "_rank", sortDir: 1, groupBy: "", show: { odds: true }, sites: SITES.slice(), stats: CORE_STATS.slice(),
                rankBy: (RANK_BASES[0] || {}).key },
  },
  compare: {
    rows: DATA.comparison || [],
    cols: p => CMP_COLS.filter(c => !c.toggle || p.show[c.toggle]),
    groups: [["", "None"], ["Player", "Player"], ["Stat", "Stat"], ["Pos", "Position"], ["Team", "Team"], ["Game", "Game"]],
    toggles: [["picks", "Sleeper pick data"]],
    defaults: { sortKey: "Kickoff (UTC)", sortDir: 1, groupBy: "Player", show: { picks: true } },
  },
};

// ---- state ------------------------------------------------------------------------
let saved = {};
try { saved = JSON.parse(localStorage.getItem("pprUi3") || "{}"); } catch (e) {}
const prefs = {};
for (const [name, v] of Object.entries(VIEWS)) {
  const s = (saved.views || {})[name] || {};
  prefs[name] = { ...v.defaults, ...s, show: { ...v.defaults.show, ...(s.show || {}) }, collapsed: new Set() };
}
const rp = prefs.rankings;
rp.sites = (rp.sites || []).filter(s => SITES.includes(s));
if (!rp.sites.length) rp.sites = SITES.slice();
rp.stats = (rp.stats || []).filter(l => BANDS.some(b => b.label === l));

const state = { view: VIEWS[saved.view] ? saved.view : "rankings", q: "", pos: new Set(), team: "", game: "", stat: "", sites: "Both" };
function save() {
  try {
    const views = {};
    for (const [n, p] of Object.entries(prefs)) {
      const { collapsed, ...rest } = p;
      views[n] = rest;
    }
    localStorage.setItem("pprUi3", JSON.stringify({ view: state.view, views }));
  } catch (e) {}
}

// ---- controls ---------------------------------------------------------------------------
const fpNote = META.fantasypros_week ? ` · FantasyPros week ${META.fantasypros_week} (top 10 per position)` : "";
$("sub").textContent = `Lines pulled ${new Date(DATA.generated).toLocaleString()}${fpNote} · click any column to sort`;

function fillSelect(el, first, values, label = v => v) {
  const cur = el.value;
  el.innerHTML = `<option value="">${first}</option>` + values.map(v => `<option value="${esc(v)}">${esc(label(v))}</option>`).join("");
  el.value = values.includes(cur) ? cur : "";
}
function setupView() {
  const v = VIEWS[state.view], p = prefs[state.view];
  for (const t of document.querySelectorAll(".tab")) t.setAttribute("aria-selected", t.dataset.view === state.view);
  $("tbl").className = "view-" + state.view;
  $("statCtl").hidden = state.view !== "compare";
  $("sitesCtl").hidden = state.view !== "compare" || !HAS_SLEEPER;
  $("rankBar").hidden = state.view !== "rankings";
  $("siteCtl").hidden = SITES.length < 2;

  const positions = [...new Set(v.rows.map(r => r.Pos).filter(Boolean))].sort(posSort);
  for (const x of [...state.pos]) if (!positions.includes(x)) state.pos.delete(x);
  $("posChips").innerHTML = ["All", ...positions].map(x => `<button class="chip" data-pos="${esc(x)}">${esc(x)}</button>`).join("");

  fillSelect($("team"), "All teams", [...new Set(v.rows.map(r => r.Team).filter(Boolean))].sort());
  const games = [...new Map(v.rows.filter(r => r.Game).map(r => [r.Game, r["Kickoff (UTC)"]])).entries()]
    .sort((a, b) => (a[1] || "").localeCompare(b[1] || "") || a[0].localeCompare(b[0]));
  const gameTime = Object.fromEntries(games);
  fillSelect($("game"), "All games", games.map(g => g[0]), g => `${g} · ${kickoff(gameTime[g])}`);
  if (state.view === "compare") fillSelect($("stat"), "All stats", [...new Set(v.rows.map(r => r.Stat))].sort());
  state.team = $("team").value; state.game = $("game").value; state.stat = $("stat").value;

  $("groupBy").innerHTML = v.groups.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  $("groupBy").value = p.groupBy;
  $("toggles").innerHTML = v.toggles.map(([k, l]) => `<button class="chip" data-toggle="${k}">${l}</button>`).join("");

  if (state.view === "rankings") {
    $("rankBy").innerHTML = RANK_BASES.map(b => `<option value="${esc(b.key)}">${esc(b.label)}</option>`).join("");
    $("siteChips").innerHTML = SITES.map(s => `<button class="chip site-${s}" data-site="${s}">${SITE_NAMES[s]}</button>`).join("");
    $("statChips").innerHTML = BANDS.map(b => `<button class="chip" data-stat="${esc(b.label)}">${esc(b.label)}</button>`).join("")
      + `<button class="chip link" data-stats="core">Core</button><button class="chip link" data-stats="all">All</button><button class="chip link" data-stats="none">None</button>`;
  }
}

document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t || t.dataset.view === state.view) return;
  state.view = t.dataset.view; save(); setupView(); render();
});
$("posChips").addEventListener("click", e => {
  const x = e.target.dataset.pos; if (!x) return;
  if (x === "All") state.pos.clear(); else state.pos.has(x) ? state.pos.delete(x) : state.pos.add(x);
  render();
});
$("toggles").addEventListener("click", e => {
  const k = e.target.dataset.toggle; if (!k) return;
  const p = prefs[state.view]; p.show[k] = !p.show[k]; save(); render();
});
$("siteChips").addEventListener("click", e => {
  const s = e.target.dataset.site; if (!s) return;
  const on = rp.sites.includes(s);
  if (on && rp.sites.length === 1) return;           // keep at least one site
  rp.sites = on ? rp.sites.filter(x => x !== s) : SITES.filter(x => x === s || rp.sites.includes(x));
  save(); render();
});
$("statChips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.stats === "all") rp.stats = BANDS.map(x => x.label);
  else if (b.dataset.stats === "none") rp.stats = [];
  else if (b.dataset.stats === "core") rp.stats = CORE_STATS.slice();
  else if (b.dataset.stat) {
    const l = b.dataset.stat;
    rp.stats = rp.stats.includes(l) ? rp.stats.filter(x => x !== l) : BANDS.map(x => x.label).filter(x => x === l || rp.stats.includes(x));
  }
  save(); render();
});
$("rankBy").addEventListener("change", e => {
  rp.rankBy = e.target.value;
  const b = RANK_BASES.find(x => x.key === rp.rankBy);
  if (b && !rp.sites.includes(b.site)) rp.sites = SITES.filter(x => x === b.site || rp.sites.includes(x));
  save(); render();
});
$("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
for (const id of ["team", "game", "stat", "sites"]) $(id).addEventListener("change", e => { state[id] = e.target.value; render(); });
$("groupBy").addEventListener("change", e => { const p = prefs[state.view]; p.groupBy = e.target.value; p.collapsed.clear(); save(); render(); });

// ---- sorting ------------------------------------------------------------------------------
function sortVal(col, r) {
  const v = r[col.key];
  switch (col.type) {
    case "text": return v === "" || v == null ? null : String(v).toLowerCase();
    case "time": return v || null;
    case "odds": return impliedProb(v);
    default: return num(v);
  }
}
function cmp(col, dir) {
  return (a, b) => {
    const x = sortVal(col, a), y = sortVal(col, b);
    if (x === null && y === null) return 0;
    if (x === null) return 1;          // blanks always last
    if (y === null) return -1;
    return x < y ? -dir : x > y ? dir : 0;
  };
}

// Rank players by the projection of the selected site(s) (average when both)
// Rank players with the chosen published number (blank for players without it)
function assignRanks(rows) {
  const basis = rankBasis();
  for (const r of rows) { r._rank = null; r._posRank = null; }
  if (!basis) return;
  const ranked = rows.filter(r => num(r[basis.key]) !== null).sort((a, b) => num(b[basis.key]) - num(a[basis.key]));
  const posCount = {};
  ranked.forEach((r, i) => { r._rank = i + 1; posCount[r.Pos] = (posCount[r.Pos] || 0) + 1; r._posRank = posCount[r.Pos]; });
}

// ---- render -------------------------------------------------------------------------------
const PAGE = 1500;
let limit = PAGE;
const cellCls = c => [c.cls || "", c.gl ? "gl" : "", c.tdCls || "", c.type === "text" || c.type === "time" ? "txt" : "", c.site ? "site-" + c.site : ""].join(" ");

// Header rows: band (stat) -> sub (site) -> label (Line/Over/...). Columns without a band span all rows.
function renderHead(cols) {
  const p = prefs[state.view];
  const depth = cols.some(c => c.sub && c.label) ? 3 : cols.some(c => c.band) ? 2 : 1;
  const th = (c, text, rowspan) => {
    const sortable = c.sortable !== false;
    const sorted = sortable && c.key === p.sortKey;
    const arrow = sorted ? (p.sortDir < 0 ? "▼" : "▲") : "";
    const cls = [sortable ? "sortable" : "", sorted ? "sorted" : "", cellCls(c)].join(" ");
    const rs = rowspan > 1 ? ` rowspan="${rowspan}"` : "";
    return `<th class="${cls}" ${sortable ? `data-key="${esc(c.key)}"` : ""} title="${esc(c.title || "")}"${rs}>${esc(text)}<span class="arrow">${arrow}</span></th>`;
  };
  const runs = (list, keyFn) => {   // consecutive runs of equal key
    const out = [];
    for (const c of list) {
      const k = keyFn(c);
      if (out.length && out[out.length - 1].k === k) out[out.length - 1].cols.push(c);
      else out.push({ k, cols: [c] });
    }
    return out;
  };
  const rows = Array.from({ length: depth }, () => "");
  for (const run of runs(cols, c => c.band || "\u0000" + c.key)) {
    const c0 = run.cols[0];
    if (!c0.band) { rows[0] += th(c0, c0.label, depth); continue; }
    rows[0] += `<th class="band" colspan="${run.cols.length}">${esc(c0.band)}</th>`;
    if (depth === 2) { rows[1] += run.cols.map(c => th(c, c.label || c.sub, 1)).join(""); continue; }
    for (const sub of runs(run.cols, c => c.sub || "\u0000" + c.key)) {
      const s0 = sub.cols[0];
      if (!s0.sub) { rows[1] += th(s0, s0.label, 2); continue; }
      if (sub.cols.length === 1 && !s0.label) { rows[1] += th(s0, s0.sub, 2); continue; }
      rows[1] += `<th class="subband site-${s0.site || ""}" colspan="${sub.cols.length}">${esc(s0.sub)}</th>`;
      rows[2] += sub.cols.map(c => th(c, c.label, 1)).join("");
    }
  }
  return rows.map(r => `<tr>${r}</tr>`).join("");
}
function renderRow(r, cols) {
  return `<tr class="p">${cols.map(c => `<td class="${cellCls(c)}">${c.render ? c.render(r) : esc(r[c.key] ?? "")}</td>`).join("")}</tr>`;
}

function filteredRows() {
  const v = VIEWS[state.view];
  let rows = v.rows;
  if (state.view === "rankings") rows = rows.filter(r => rp.sites.some(s => r._has[s]));
  return rows.filter(r =>
    (!state.pos.size || state.pos.has(r.Pos)) &&
    (!state.team || r.Team === state.team) &&
    (!state.game || r.Game === state.game) &&
    (!state.q || String(r.Player).toLowerCase().includes(state.q)) &&
    (state.view !== "compare" || ((!state.stat || r.Stat === state.stat) && (!state.sites || !HAS_SLEEPER || r.Sites === state.sites))));
}

function render(keepLimit) {
  if (!keepLimit) limit = PAGE;
  const v = VIEWS[state.view], p = prefs[state.view];
  for (const b of $("posChips").children) {
    const x = b.dataset.pos;
    b.setAttribute("aria-pressed", x === "All" ? state.pos.size === 0 : state.pos.has(x));
  }
  for (const b of $("toggles").children) b.setAttribute("aria-pressed", !!p.show[b.dataset.toggle]);
  if (HAS_SLEEPER) $("sites").value = state.sites;
  if (state.view === "rankings") {
    for (const b of $("siteChips").children) b.setAttribute("aria-pressed", rp.sites.includes(b.dataset.site));
    for (const b of $("statChips").children) if (b.dataset.stat) b.setAttribute("aria-pressed", rp.stats.includes(b.dataset.stat));
    const basis = rankBasis();
    $("rankBy").value = basis ? basis.key : "";
    assignRanks(v.rows);
  }

  const cols = v.cols(p);
  const sortCol = cols.find(c => c.key === p.sortKey) || cols[0];
  const rows = filteredRows().sort(cmp(sortCol, p.sortKey === sortCol.key ? p.sortDir : 1));
  const total = state.view === "rankings" ? v.rows.filter(r => rp.sites.some(s => r._has[s])).length : v.rows.length;
  $("count").textContent = `${rows.length.toLocaleString()} of ${total.toLocaleString()} ${state.view === "compare" ? "props" : "players"}`;

  const tbl = $("tbl");
  tbl.querySelectorAll("tbody, tfoot").forEach(t => t.remove());
  $("thead").innerHTML = renderHead(cols);

  if (!rows.length) {
    tbl.insertAdjacentHTML("beforeend", `<tbody><tr><td class="empty" colspan="${cols.length}">No rows match these filters.</td></tr></tbody>`);
    return;
  }

  let html = "", shown = 0, expanded = rows.length;
  if (!p.groupBy) {
    const slice = rows.slice(0, limit);
    shown = slice.length;
    html = `<tbody>${slice.map(r => renderRow(r, cols)).join("")}</tbody>`;
  } else {
    const groups = new Map();
    for (const r of rows) {
      const k = r[p.groupBy] || "—";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    let keys = [...groups.keys()];
    if (p.groupBy === "Pos") keys.sort(posSort);
    else if (p.groupBy === "Game") keys.sort((a, b) => (groups.get(a)[0]["Kickoff (UTC)"] || "").localeCompare(groups.get(b)[0]["Kickoff (UTC)"] || "") || a.localeCompare(b));
    else if (p.groupBy !== "Player") keys.sort();   // Player groups follow the current sort
    const basis = rankBasis();
    for (const k of keys) {
      const g = groups.get(k);
      const collapsed = p.collapsed.has(k);
      let meta = `${g.length} ${state.view === "compare" ? "prop" : "player"}${g.length === 1 ? "" : "s"}`;
      if (state.view === "rankings" && basis) {
        const vals = g.map(r => num(r[basis.key])).filter(x => x !== null);
        if (vals.length) meta += ` · avg ${(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)} (${basis.label})`;
      } else {
        const both = g.filter(r => r.Sites === "Both"), diff = both.filter(r => num(r["Line Δ (SL−UD)"]));
        if (both.length) meta += ` · ${both.length} on both sites · ${diff.length} with different lines`;
      }
      html += `<tbody><tr class="gh${collapsed ? " collapsed" : ""}" data-group="${esc(k)}"><td colspan="${cols.length}"><span class="caret">▾</span>${esc(k)}<span class="gmeta">${meta}</span></td></tr>`;
      if (collapsed) {
        expanded -= g.length;
      } else {
        const slice = g.slice(0, Math.max(0, limit - shown));   // past the limit, groups show headers only
        shown += slice.length;
        html += slice.map(r => renderRow(r, cols)).join("");
      }
      html += `</tbody>`;
    }
  }
  if (shown < expanded) {
    html += `<tfoot><tr><td class="more" colspan="${cols.length}"><button id="more">Show more (${(expanded - shown).toLocaleString()} left)</button></td></tr></tfoot>`;
  }
  tbl.insertAdjacentHTML("beforeend", html);
}

$("thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-key]"); if (!th) return;
  const p = prefs[state.view];
  const col = VIEWS[state.view].cols(p).find(c => c.key === th.dataset.key);
  if (!col) return;
  if (p.sortKey === col.key) p.sortDir *= -1;
  else { p.sortKey = col.key; p.sortDir = (["text", "time"].includes(col.type) || ["_rank", "_posRank"].includes(col.key)) ? 1 : -1; }
  save(); render();
});
$("tbl").addEventListener("click", e => {
  if (e.target.id === "more") { limit += PAGE; render(true); return; }
  const gh = e.target.closest("tr.gh"); if (!gh) return;
  const p = prefs[state.view], k = gh.dataset.group;
  p.collapsed.has(k) ? p.collapsed.delete(k) : p.collapsed.add(k);
  render(true);
});

setupView();
render();
</script>
</body>
</html>
